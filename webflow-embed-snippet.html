<!--
  TikTok Caption Generator - Webflow Embed snippet
  Paste this into the Webflow Embed element (the "Tool embed" CMS field).
  Replace BOTH instances of YOUR-SITE-NAME.netlify.app with your real Netlify URL.
-->
<iframe
  id="siTTCapFrame"
  src="https://YOUR-SITE-NAME.netlify.app"
  style="width:100%;border:none;overflow:hidden;display:block;"
  scrolling="no"
  title="Free TikTok Caption Generator"
  loading="lazy">
</iframe>

<script>
(function () {
  var frame = document.getElementById("siTTCapFrame");
  window.addEventListener("message", function (e) {
    // Only accept height messages from the tool's own origin
    if (e.origin !== "https://YOUR-SITE-NAME.netlify.app") return;
    if (e.data && e.data.type === "siTTCapHeight" && e.data.height) {
      frame.style.height = e.data.height + "px";
    }
  });
})();
</script>
